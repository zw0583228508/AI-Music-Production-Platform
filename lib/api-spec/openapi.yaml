        id: { type: string }
        jobId: { type: string }
        provider:
          type: string
          enum: [BS_ROFORMER, ALL_IN_ONE, MT3, BASIC_PITCH, ACE_STEP, MUSICGEN, ANYACCOMP, LADA_BAND, HAFM, SYMPHONYGEN, METEOR, MIDI_SAG, MUSE_CONTROL_LITE, STABLE_AUDIO_3_SMALL_MUSIC, STABLE_AUDIO_3_MEDIUM]
        modelVersion: { type: string }
        reportedModelVersion:
          type: [string, "null"]
        providerRequestId:
          type: [string, "null"]
        seed: { type: number }
        rank:
          type: [number, "null"]
        label: { type: string }
        score: { type: number }
        confidence: { type: number }
        summary: { type: string }
        status:
