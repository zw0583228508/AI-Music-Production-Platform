      type: object
      required: [tempo, meter, key, melody, harmony, sections, energy]
      properties:
        tempo: { type: array, items: { type: string } }
        meter: { type: array, items: { type: string } }
        key: { type: array, items: { type: string } }
        melody: { type: array, items: { type: string } }
        harmony: { type: array, items: { type: string } }
        sections: { type: array, items: { type: string } }
        energy: { type: array, items: { type: string } }
