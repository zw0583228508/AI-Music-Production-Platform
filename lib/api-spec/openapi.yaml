      properties:
        affectedSections:
          type: array
          items: { type: string }
        affectedTracks:
          type: array
          items: { type: string }
        trackMembershipChanges: { type: number, minimum: 0 }
        chordChanges: { type: number, minimum: 0 }
        noteChanges: { type: number, minimum: 0 }
        ccChanges: { type: number, minimum: 0 }
        conductorControls:
          type: array
          items: { type: string }
        candidateSelectionChanged: { type: boolean }
    ArrangementRevisionSnapshot:
      type: object
      required: [name, harmonyComplexity, energy, density, orchestraSize, rhythmIntensity, selectedCandidateId, sections]
      properties:
        name: { type: string }
        harmonyComplexity: { type: number }
        energy: { type: number }
        density: { type: number }
        orchestraSize: { type: number }
        rhythmIntensity: { type: number }
        selectedCandidateId: { type: ["string", "null"] }
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ArrangementSection"
    ArrangementRevision:
      type: object
      required: [id, arrangementId, version, snapshot, summary, createdAt]
      properties:
        id: { type: string }
        arrangementId: { type: string }
        version: { type: number }
        snapshot:
          $ref: "#/components/schemas/ArrangementRevisionSnapshot"
        summary:
          $ref: "#/components/schemas/ArrangementRevisionSummary"
        createdAt: { type: string }
    RestoreArrangementRevisionInput:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: number, minimum: 1 }
    ArrangementSection:
      type: object
      required: [name, energy, density, tracks]
      properties:
        name: { type: string }
        energy: { type: number }
        density: { type: number }
        tracks:
          type: array
          items: { type: string }
        startBar: { type: number }
        endBar: { type: number }
        chords:
          type: array
          items:
            $ref: "#/components/schemas/EditorChordEvent"
        markers:
          type: array
          items:
            $ref: "#/components/schemas/TimelineMarker"
        automation:
          type: array
          items:
            $ref: "#/components/schemas/AutomationPoint"
        midiNotes:
          type: array
          items:
            $ref: "#/components/schemas/PianoNote"
        cc:
          type: array
          items: { type: number, minimum: 0, maximum: 127 }
        midiTracks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MidiTrackEditor"
        transposeSemitones: { type: number, minimum: -24, maximum: 24 }
    EditorChordEvent:
      type: object
      required: [id, startBeat, durationBeats, symbol, quality, inversion]
      properties:
        id: { type: string }
        startBeat: { type: number }
        durationBeats: { type: number }
        symbol: { type: string }
        quality:
          type: string
          enum: [major, minor, dominant, suspended, diminished]
        inversion: { type: number, minimum: 0, maximum: 3 }
        bass: { type: string }
    TimelineMarker:
      type: object
      required: [id, bar, label, color]
      properties:
        id: { type: string }
        bar: { type: number }
        label: { type: string }
        color: { type: string }
    AutomationPoint:
      type: object
      required: [bar, value]
