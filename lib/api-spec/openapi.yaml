        tempo: { $ref: "#/components/schemas/SongModelFieldStatusProperty" }
        meter: { $ref: "#/components/schemas/SongModelFieldStatusProperty" }
        key: { $ref: "#/components/schemas/SongModelFieldStatusProperty" }
        melody: { $ref: "#/components/schemas/SongModelFieldStatusProperty" }
        harmony: { $ref: "#/components/schemas/SongModelFieldStatusProperty" }
        sections: { $ref: "#/components/schemas/SongModelFieldStatusProperty" }
        energy: { $ref: "#/components/schemas/SongModelFieldStatusProperty" }
