        id: { type: string }
        startBeat: { type: number }
        durationBeats: { type: number }
        symbol: { type: string }
        quality:
          type: string
          enum: [major, minor, dominant, suspended, diminished]
        inversion: { type: number, minimum: 0, maximum: 3 }
        bass: { type: string }
    TimelineMarker:
      type: object
      required: [id, bar, label, color]
      properties:
        id: { type: string }
        bar: { type: number }
        label: { type: string }
        color: { type: string }
    AutomationPoint:
      type: object
      required: [bar, value]
      properties:
        bar: { type: number }
        value: { type: number, minimum: 0, maximum: 1 }
    PianoNote:
      type: object
      required: [id, pitch, start, duration, velocity, articulation]
      properties:
        id: { type: string }
        pitch: { type: number, minimum: 0, maximum: 127 }
        start: { type: number, minimum: 0 }
        duration: { type: number, minimum: 0.0625 }
        velocity: { type: number, minimum: 1, maximum: 127 }
        articulation:
          type: string
          enum: [sustain, staccato, accent, ghost]
    MidiTrackEditor:
      type: object
      required: [notes, cc]
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/PianoNote"
        cc:
          type: array
          items: { type: number, minimum: 0, maximum: 127 }
    GenerationInput:
      type: object
      properties:
        candidates: { type: number, minimum: 1, maximum: 3 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        operation:
          type: string
          enum: [COMPLETE, LEGO, REPAINT, COVER, EXTRACT]
          description: Explicit ACE-Step operation. Supplying it selects ACE-Step.
        sourceArtifactId:
          type: string
          minLength: 1
          maxLength: 200
          description: Project-owned source artifact used by source-conditioned ACE-Step operations.
        instrument:
          type: string
          minLength: 1
          maxLength: 64
          description: Focused instrument family required by LEGO and EXTRACT.
        region:
          type: object
          required: [unit, start, end]
          properties:
            unit:
              type: string
              enum: [bar, beat, time]
            start: { type: number, minimum: 0 }
            end: { type: number, exclusiveMinimum: 0 }
            crossfadeSeconds: { type: number, minimum: 0, maximum: 10, default: 0.25 }
        provider:
          type: string
          enum: [BS_ROFORMER, ALL_IN_ONE, MT3, BASIC_PITCH, ACE_STEP, MUSICGEN, ANYACCOMP, SYMPHONYGEN, METEOR, MIDI_SAG]
        task:
          type: string
          enum: [SEPARATION, TRANSCRIPTION, ACCOMPANIMENT, ORCHESTRATION, ARRANGEMENT]
        hardware:
          type: string
          enum: [AUTO, CPU, GPU]
        speed:
          type: string
          enum: [FAST, BALANCED, QUALITY]
        seed: { type: number }
        parameters:
          type: object
          additionalProperties: true
    GenerationProvenance:
      type: object
      required: [jobId, candidateId, provider, modelVersion, seed, parameters, parentArtifactIds, evaluation]
      properties:
        jobId: { type: string }
        candidateId: { type: string }
        provider:
          type: string
          enum: [BS_ROFORMER, ALL_IN_ONE, MT3, BASIC_PITCH, ACE_STEP, MUSICGEN, ANYACCOMP, SYMPHONYGEN, METEOR, MIDI_SAG]
        modelVersion: { type: string }
        reportedModelVersion:
          type: [string, "null"]
        providerRequestId:
          type: [string, "null"]
        songModelVersion:
          type: [number, "null"]
        seed: { type: number }
        parameters:
          type: object
          additionalProperties: true
        parentArtifactIds:
          type: array
          items: { type: string }
        evaluation:
          $ref: "#/components/schemas/CandidateEvaluation"
    GenerationJob:
      type: object
      required: [id, projectId, arrangementId, task, status, provider, modelVersion, providerRuntime, hardware, speed, progress, stage, requestedCandidates, seed, parameters, parentArtifactIds, retryable, attempt, maxAttempts, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        arrangementId: { type: string }
        task:
          type: string
          enum: [SEPARATION, TRANSCRIPTION, ACCOMPANIMENT, ORCHESTRATION, ARRANGEMENT]
        status:
          type: string
          enum: [queued, running, cancel_requested, cancelled, succeeded, failed]
        provider:
          type: string
          enum: [BS_ROFORMER, ALL_IN_ONE, MT3, BASIC_PITCH, ACE_STEP, MUSICGEN, ANYACCOMP, SYMPHONYGEN, METEOR, MIDI_SAG]
        modelVersion: { type: string }
        providerRuntime:
          oneOf:
            - $ref: "#/components/schemas/ProviderRuntimeSnapshot"
            - type: "null"
        hardware:
          type: string
          enum: [AUTO, CPU, GPU]
        speed:
          type: string
          enum: [FAST, BALANCED, QUALITY]
        progress: { type: number, minimum: 0, maximum: 100 }
        stage: { type: string }
        providerRequestId:
          type: [string, "null"]
        requestedCandidates: { type: number }
        seed: { type: number }
        parameters:
          type: object
          additionalProperties: true
        parentArtifactIds:
          type: array
          items: { type: string }
        error:
          type: [string, "null"]
        errorCode:
          type: [string, "null"]
        retryable: { type: boolean }
        attempt: { type: number, minimum: 0 }
        maxAttempts: { type: number, minimum: 1 }
        cancelRequestedAt:
          type: [string, "null"]
        createdAt: { type: string }
        updatedAt: { type: string }
        completedAt:
          type: [string, "null"]
    CandidateQualityReport:
      type: object
      required: [score, checks, weights, strengths, weaknesses, warnings, evaluatedAt, renderArtifactIds, lineageComplete]
      properties:
        score: { type: number, minimum: 0, maximum: 1 }
        checks:
          type: object
          additionalProperties: { type: number }
        weights:
          type: object
          additionalProperties: { type: number }
        strengths:
          type: array
          items: { type: string }
        weaknesses:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
        evaluatedAt: { type: string }
        renderArtifactIds:
          type: array
          items: { type: string }
        lineageComplete: { type: boolean }
    CandidateEvaluation:
      type: object
