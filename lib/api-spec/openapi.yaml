        bar: { type: number }
        value: { type: number, minimum: 0, maximum: 1 }
    PianoNote:
      type: object
      required: [id, pitch, start, duration, velocity, articulation]
      properties:
        id: { type: string }
        pitch: { type: number, minimum: 0, maximum: 127 }
        start: { type: number, minimum: 0 }
        duration: { type: number, minimum: 0.0625 }
        velocity: { type: number, minimum: 1, maximum: 127 }
        articulation:
          type: string
          enum: [sustain, staccato, accent, ghost]
    MidiTrackEditor:
      type: object
      required: [notes, cc]
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/PianoNote"
        cc:
          type: array
          items: { type: number, minimum: 0, maximum: 127 }
    GenerationInput:
      type: object
      properties:
        candidates: { type: number, minimum: 1, maximum: 5 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        operation:
          type: string
          enum: [COMPLETE, LEGO, REPAINT, COVER, EXTRACT]
          description: Explicit ACE-Step operation. Supplying it selects ACE-Step.
        sourceArtifactId:
          type: string
          minLength: 1
          maxLength: 200
          description: Project-owned source artifact used by source-conditioned ACE-Step operations.
        instrument:
          type: string
          minLength: 1
          maxLength: 64
          description: Focused instrument family required by LEGO and EXTRACT.
        region:
          type: object
          required: [unit, start, end]
          properties:
            unit:
              type: string
              enum: [bar, beat, time]
            start: { type: number, minimum: 0 }
            end: { type: number, exclusiveMinimum: 0 }
            crossfadeSeconds: { type: number, minimum: 0, maximum: 10, default: 0.25 }
        provider:
          type: string
          enum: [BS_ROFORMER, ALL_IN_ONE, MT3, BASIC_PITCH, ACE_STEP, MUSICGEN, ANYACCOMP, LADA_BAND, HAFM, SYMPHONYGEN, METEOR, MIDI_SAG, MUSE_CONTROL_LITE, STABLE_AUDIO_3_SMALL_MUSIC, STABLE_AUDIO_3_MEDIUM]
        task:
          type: string
          enum: [SEPARATION, TRANSCRIPTION, ACCOMPANIMENT, ORCHESTRATION, ARRANGEMENT]
        hardware:
          type: string
          enum: [AUTO, CPU, GPU]
        speed:
          type: string
          enum: [FAST, BALANCED, QUALITY]
        seed: { type: number }
        parameters:
          type: object
          additionalProperties: true
    GenerationProvenance:
      type: object
      required: [jobId, candidateId, provider, modelVersion, seed, parameters, parentArtifactIds, evaluation]
      properties:
        jobId: { type: string }
        candidateId: { type: string }
        provider:
          type: string
          enum: [BS_ROFORMER, ALL_IN_ONE, MT3, BASIC_PITCH, ACE_STEP, MUSICGEN, ANYACCOMP, LADA_BAND, HAFM, SYMPHONYGEN, METEOR, MIDI_SAG, MUSE_CONTROL_LITE, STABLE_AUDIO_3_SMALL_MUSIC, STABLE_AUDIO_3_MEDIUM]
        modelVersion: { type: string }
        reportedModelVersion:
          type: [string, "null"]
        providerRequestId:
          type: [string, "null"]
        songModelVersion:
          type: [number, "null"]
        seed: { type: number }
        parameters:
          type: object
          additionalProperties: true
        parentArtifactIds:
          type: array
          items: { type: string }
        evaluation:
          $ref: "#/components/schemas/CandidateEvaluation"
    GenerationJob:
      type: object
      required: [id, projectId, arrangementId, task, status, provider, modelVersion, providerRuntime, hardware, speed, progress, stage, requestedCandidates, seed, parameters, parentArtifactIds, retryable, attempt, maxAttempts, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        arrangementId: { type: string }
        task:
          type: string
          enum: [SEPARATION, TRANSCRIPTION, ACCOMPANIMENT, ORCHESTRATION, ARRANGEMENT]
        status:
          type: string
          enum: [queued, running, cancel_requested, cancelled, succeeded, failed]
        provider:
          type: string
          enum: [BS_ROFORMER, ALL_IN_ONE, MT3, BASIC_PITCH, ACE_STEP, MUSICGEN, ANYACCOMP, LADA_BAND, HAFM, SYMPHONYGEN, METEOR, MIDI_SAG, MUSE_CONTROL_LITE, STABLE_AUDIO_3_SMALL_MUSIC, STABLE_AUDIO_3_MEDIUM]
        modelVersion: { type: string }
        providerRuntime:
          oneOf:
            - $ref: "#/components/schemas/ProviderRuntimeSnapshot"
            - type: "null"
        hardware:
          type: string
          enum: [AUTO, CPU, GPU]
        speed:
          type: string
          enum: [FAST, BALANCED, QUALITY]
        progress: { type: number, minimum: 0, maximum: 100 }
        stage: { type: string }
        providerRequestId:
          type: [string, "null"]
        requestedCandidates: { type: number }
        seed: { type: number }
        parameters:
          type: object
          additionalProperties: true
        parentArtifactIds:
          type: array
          items: { type: string }
        error:
          type: [string, "null"]
        errorCode:
          type: [string, "null"]
        retryable: { type: boolean }
        attempt: { type: number, minimum: 0 }
        maxAttempts: { type: number, minimum: 1 }
        cancelRequestedAt:
          type: [string, "null"]
        createdAt: { type: string }
        updatedAt: { type: string }
        completedAt:
          type: [string, "null"]
    CandidateQualityReport:
      type: object
      required: [score, checks, weights, strengths, weaknesses, warnings, evaluatedAt, renderArtifactIds, lineageComplete]
      properties:
        score: { type: number, minimum: 0, maximum: 1 }
        checks:
          type: object
          additionalProperties: { type: number }
        weights:
          type: object
          additionalProperties: { type: number }
        strengths:
          type: array
          items: { type: string }
        weaknesses:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
        evaluatedAt: { type: string }
        renderArtifactIds:
          type: array
          items: { type: string }
        lineageComplete: { type: boolean }
    CandidateEvaluation:
      type: object
      required: [status, providerScore, renderArtifactIds, artifacts, qualityReport, musicCritic, audioCritic, error]
      properties:
        status:
          type: string
          enum: [plan_received, rendering, render_succeeded, analyzing, evaluated, render_failed, analysis_failed, diversity_rejected, repair_not_improved, repair_scope_violated]
        providerScore: { type: number }
        renderArtifactIds:
          type: array
          items: { type: string }
        artifacts:
          type: array
          items:
            type: object
            required: [id, type, label, url]
            properties:
              id: { type: string }
              type:
                type: string
                enum: [AUDIO_TRACK, MIDI, QUALITY_REPORT]
              label: { type: string }
              url: { type: string }
              artifactSha256:
                type: string
                pattern: '^[a-f0-9]{64}$'
                description: SHA-256 of the exact stored artifact bytes; absent on historical rows.
        qualityReport:
          oneOf:
            - $ref: "#/components/schemas/CandidateQualityReport"
            - type: "null"
        musicCritic:
          oneOf:
            - $ref: "#/components/schemas/CandidateMusicCriticReport"
            - type: "null"
        audioCritic:
          oneOf:
            - $ref: "#/components/schemas/CandidateAudioCriticReport"
            - type: "null"
        error:
          type: [string, "null"]
        strategy:
          type: object
          required: [name, index, baseSeed, seed]
          properties:
            name: { type: string, enum: [sparse, balanced, rhythmic, harmonic, orchestral] }
            index: { type: number, minimum: 0 }
            baseSeed: { type: number, minimum: 0, maximum: 2147483647 }
            seed: { type: number, minimum: 0, maximum: 2147483647 }
        diversity:
          type: object
          required: [comparedToCandidateId, distance, threshold, rejected, reason]
          properties:
            comparedToCandidateId: { type: [string, "null"] }
            distance: { type: [number, "null"] }
            threshold: { type: number, const: 0.25 }
            rejected: { type: boolean }
            reason: { type: string, enum: [baseline_retained, near_duplicate, sufficiently_distinct] }
        repair:
          $ref: "#/components/schemas/CandidateRepairEvidence"
    CandidateMusicCriticEvidence:
      type: object
      required: [source, summary, observations]
      properties:
        source:
          type: string
          enum: [vocal_activity, harmony_decisions, section_plan, track_notes, instrument_constraints, style_and_directives, composition_intelligence, rhythm_evidence]
        summary: { type: string }
        observations:
          type: object
          additionalProperties:
            oneOf:
              - { type: string }
              - { type: number }
              - { type: boolean }
    CandidateMusicCriticDimensionResultV1:
      type: object
      required: [status, score, evidence, explanation, findings]
      properties:
        status: { type: string, enum: [available, unavailable, failed] }
        score: { type: [number, "null"], minimum: 0, maximum: 1 }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/CandidateMusicCriticEvidence" }
        explanation: { type: string }
        findings:
          type: array
          items: { $ref: "#/components/schemas/CandidateMusicCriticFindingV1" }
    CandidateMusicCriticFindingV1:
      type: object
      additionalProperties: false
      required: [id, affectedSections, startBar, endBar, affectedTrackIds, musicalReason]
      properties:
        id: { type: string, minLength: 1 }
        affectedSections: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        startBar: { type: number, minimum: 1 }
        endBar: { type: number, minimum: 1 }
        affectedTrackIds: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        musicalReason: { type: string, minLength: 1, maxLength: 2000 }
    CandidateMusicCriticDimensionResult:
      type: object
      required: [status, score, evidence, explanation, findings]
      properties:
        status: { type: string, enum: [available, unavailable, failed] }
        score: { type: [number, "null"], minimum: 0, maximum: 1 }
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/CandidateMusicCriticEvidence"
        explanation: { type: string }
        findings:
          type: array
          description: Deterministically ordered, non-overlapping server-authored scopes eligible for individual bounded repair.
          items:
            $ref: "#/components/schemas/CandidateMusicCriticFinding"
    CandidateMusicCriticFinding:
      type: object
      additionalProperties: false
      required: [id, affectedSections, startBar, endBar, affectedTrackIds, affectedRoles, canonicalScope, evidenceReferences, permissibleRepairOperations, musicalReason]
      properties:
        id: { type: string, minLength: 1 }
        affectedSections:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        startBar: { type: number, minimum: 1 }
        endBar: { type: number, minimum: 1 }
        affectedTrackIds:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        affectedRoles:
          type: array
          items: { type: string, minLength: 1 }
        canonicalScope:
          type: object
          required: [startBar, endBar]
          properties:
            startBar: { type: number, minimum: 1 }
            endBar: { type: number, minimum: 1 }
        evidenceReferences:
          type: array
          maxItems: 8
          items:
            type: object
            required: [source, summary]
            properties:
              source: { type: string }
              summary: { type: string, maxLength: 2000 }
        permissibleRepairOperations:
          type: array
          minItems: 1
          items:
            type: string
            enum: [adjust_notes, adjust_rhythm, adjust_register, adjust_dynamics, adjust_voicing, adjust_directive]
        musicalReason: { type: string, minLength: 1, maxLength: 2000 }
    CandidateMusicCriticReport:
      oneOf:
        - $ref: "#/components/schemas/CandidateMusicCriticReportV1"
        - $ref: "#/components/schemas/CandidateMusicCriticReportV2"
      discriminator:
        propertyName: version
        mapping:
          music-critic-v1: "#/components/schemas/CandidateMusicCriticReportV1"
          music-critic-v2: "#/components/schemas/CandidateMusicCriticReportV2"
    CandidateMusicCriticReportV1:
      type: object
      required: [version, score, coverage, dimensions]
      properties:
        version: { type: string, const: music-critic-v1 }
        score: { type: number, minimum: 0, maximum: 1 }
        coverage:
          type: object
          description: Producer-safe summary of how broadly the aggregate score is supported.
          required: [availableDimensions, totalDimensions, sparse]
          properties:
            availableDimensions:
              type: number
              minimum: 0
              maximum: 8
            totalDimensions: { type: number, const: 8 }
            sparse:
              type: boolean
              description: True when fewer than half of the critic dimensions have available evidence.
        dimensions:
          type: object
          required: [vocalFit, harmony, development, contrastAndTransitions, registerCollisions, playability, repetition, styleAndControlAdherence]
          properties:
            vocalFit: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResultV1" }
            harmony: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResultV1" }
            development: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResultV1" }
            contrastAndTransitions: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResultV1" }
            registerCollisions: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResultV1" }
            playability: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResultV1" }
            repetition: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResultV1" }
            styleAndControlAdherence: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResultV1" }
    CandidateMusicCriticReportV2:
      type: object
      required: [version, score, coverage, dimensions]
      properties:
        version: { type: string, const: music-critic-v2 }
        score: { type: number, minimum: 0, maximum: 1 }
        coverage:
          type: object
          required: [availableDimensions, totalDimensions, sparse]
          properties:
            availableDimensions: { type: number, minimum: 0, maximum: 17 }
            totalDimensions: { type: number, const: 17 }
            sparse: { type: boolean }
        dimensions:
          type: object
          required: [vocalFit, harmony, development, contrastAndTransitions, registerCollisions, playability, repetition, styleAndControlAdherence, motifContinuityAndDevelopment, phraseIntent, vocalInteraction, roleDuplication, orchestralBalance, grooveCoordination, voiceLeading, countermelodyShape, dramaticTrajectory]
          properties:
            vocalFit: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResult" }
            harmony: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResult" }
            development: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResult" }
            contrastAndTransitions: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResult" }
            registerCollisions: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResult" }
            playability: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResult" }
            repetition: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResult" }
            styleAndControlAdherence: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResult" }
            motifContinuityAndDevelopment: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResult" }
            phraseIntent: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResult" }
            vocalInteraction: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResult" }
            roleDuplication: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResult" }
            orchestralBalance: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResult" }
            grooveCoordination: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResult" }
            voiceLeading: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResult" }
            countermelodyShape: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResult" }
            dramaticTrajectory: { $ref: "#/components/schemas/CandidateMusicCriticDimensionResult" }
    CandidateAudioCriticEvidence:
      type: object
      description: Privacy-bounded evidence derived only from the rendered PCM and its artifact lineage; it contains no samples, waveform, or private source URL.
      required: [artifactId, artifactSha256, sampleRate, analyzerVersion]
      properties:
        artifactId: { type: string }
        artifactSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        sampleRate: { type: number, minimum: 1 }
        analyzerVersion: { type: string }
    CandidateAudioCriticFinding:
      type: object
      required: [id, startSeconds, endSeconds, confidence, provenance, recommendation]
      properties:
        id: { type: string }
        startSeconds: { type: number, minimum: 0 }
        endSeconds: { type: number, minimum: 0 }
        affectedTrackIds: { type: array, items: { type: string } }
        confidence: { type: number, minimum: 0, maximum: 1 }
        provenance: { type: string, enum: [rendered_pcm] }
        recommendation: { type: string, maxLength: 2000 }
    CandidateAudioCriticDimensionResult:
      type: object
      required: [status, score, explanation, findings]
      properties:
        status: { type: string, enum: [available, unavailable, failed] }
        score: { type: [number, "null"], minimum: 0, maximum: 1 }
        explanation: { type: string }
        findings:
          type: array
          items: { $ref: "#/components/schemas/CandidateAudioCriticFinding" }
    CandidateAudioCriticReport:
      type: object
      description: Deterministic perceptual analysis of rendered PCM. An unavailable, failed, or insufficient report must not be used as positive release evidence.
      required: [version, status, score, coverage, evidence, dimensions]
      properties:
        version: { type: string, const: perceptual-audio-critic-v1 }
        status: { type: string, enum: [available, unavailable, failed, insufficient] }
        score: { type: [number, "null"], minimum: 0, maximum: 1 }
        coverage:
          type: object
          required: [availableDimensions, totalDimensions, sufficient]
          properties:
            availableDimensions: { type: number, minimum: 0, maximum: 7 }
            totalDimensions: { type: number, const: 7 }
            sufficient: { type: boolean }
        evidence:
          oneOf:
            - $ref: "#/components/schemas/CandidateAudioCriticEvidence"
            - type: "null"
        dimensions:
          type: object
          required: [vocalFit, masking, balance, dynamics, artifactsAndDistortion, transitions, repetition]
          properties:
            vocalFit: { $ref: "#/components/schemas/CandidateAudioCriticDimensionResult" }
            masking: { $ref: "#/components/schemas/CandidateAudioCriticDimensionResult" }
            balance: { $ref: "#/components/schemas/CandidateAudioCriticDimensionResult" }
            dynamics: { $ref: "#/components/schemas/CandidateAudioCriticDimensionResult" }
            artifactsAndDistortion: { $ref: "#/components/schemas/CandidateAudioCriticDimensionResult" }
            transitions: { $ref: "#/components/schemas/CandidateAudioCriticDimensionResult" }
            repetition: { $ref: "#/components/schemas/CandidateAudioCriticDimensionResult" }
    CandidateRepairInput:
      type: object
