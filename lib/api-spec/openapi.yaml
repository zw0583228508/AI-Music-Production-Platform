            $ref: "#/components/schemas/ChordBassSupportEvidence"
    GenerationProvider:
      type: object
      required: [id, name, modelVersion, tasks, hardware, speeds, available, status, configured, checkpointReady, runtimeReady, smokeTested, reportedVersion, lastHealth]
      properties:
        id:
          type: string
          enum: [BS_ROFORMER, ALL_IN_ONE, MT3, BASIC_PITCH, ACE_STEP, MUSICGEN, ANYACCOMP, LADA_BAND, HAFM, SYMPHONYGEN, METEOR, MIDI_SAG, MUSE_CONTROL_LITE, STABLE_AUDIO_3_SMALL_MUSIC, STABLE_AUDIO_3_MEDIUM]
        name: { type: string }
        modelVersion: { type: string }
        tasks:
          type: array
          items:
            type: string
            enum: [SEPARATION, TRANSCRIPTION, ACCOMPANIMENT, ORCHESTRATION, ARRANGEMENT]
        hardware:
          type: array
          items:
            type: string
            enum: [CPU, GPU]
        speeds:
          type: array
          items:
            type: string
            enum: [FAST, BALANCED, QUALITY]
        available: { type: boolean }
        status:
          type: string
          enum: [ready, configured, unavailable]
        configured: { type: boolean }
        checkpointReady: { type: boolean }
        runtimeReady: { type: boolean }
        smokeTested:
          type: boolean
          description: True only when the worker's live health response proves a real smoke inference completed.
        reportedVersion:
          type: [string, "null"]
        reportedChecksum:
          type: [string, "null"]
        runtimeProvenance:
          oneOf:
            - $ref: "#/components/schemas/ProviderRuntimeProvenance"
            - type: "null"
        lastHealth:
          $ref: "#/components/schemas/ProviderHealthResult"
    ProviderHealthResult:
      type: object
      required: [status, checkedAt, latencyMs, message]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, unknown]
        checkedAt:
          type: [string, "null"]
        latencyMs:
          type: [number, "null"]
        message:
          type: [string, "null"]
    ProviderRuntimeSnapshot:
      type: object
      required: [availability, configurationReady, checkpointReady, runtimeReady, smokeTested, healthStatus, checkedAt, latencyMs, message, reportedVersion]
      properties:
        availability:
          type: string
          enum: [ready, configured, unavailable]
        configurationReady: { type: boolean }
        checkpointReady: { type: boolean }
        runtimeReady: { type: boolean }
        smokeTested: { type: boolean }
        healthStatus:
          type: string
          enum: [healthy, unhealthy, unknown]
        checkedAt:
          type: [string, "null"]
        latencyMs:
          type: [number, "null"]
        message:
          type: [string, "null"]
        reportedVersion:
          type: [string, "null"]
        reportedChecksum:
          type: [string, "null"]
        runtimeProvenance:
          oneOf:
            - $ref: "#/components/schemas/ProviderRuntimeProvenance"
            - type: "null"
    ProviderRuntimeProvenance:
      type: object
      description: Immutable worker attestation captured from live health and required to match the completion payload. The Modal image ID is the independently promoted runtime identity; the source image digest is retained as an additional compatibility check.
      required: [model, checkpointSha256, revision, modalImageId, sourceImageDigest, cudaVersion, pytorchVersion, gpu]
      properties:
        model: { type: string }
        checkpointSha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
        revision: { type: string }
        modalImageId: { type: string, pattern: "^im-[A-Za-z0-9]+$" }
        sourceImageDigest: { type: string, pattern: "^sha256:[a-fA-F0-9]{64}$" }
        cudaVersion: { type: string }
        pytorchVersion: { type: string }
        gpu: { type: string }
    GenerationResult:
      type: object
      required: [arrangement, candidates, selectedCandidate, provider]
      properties:
        arrangement:
          $ref: "#/components/schemas/Arrangement"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
        selectedCandidate: { type: string }
        provider:
          $ref: "#/components/schemas/MusicProvider"
    Candidate:
      type: object
      required: [id, label, score, summary, provider]
      properties:
        id: { type: string }
        label: { type: string }
        score: { type: number }
        summary: { type: string }
        provider: { type: string }
    ExportInput:
      type: object
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        arrangementId: { type: ["string", "null"] }
        approvedRevisionId: { type: string, minLength: 1 }
        includeStems: { type: boolean }
        includeMidi: { type: boolean }
        includeMix: { type: boolean }
        includeMetadata: { type: boolean }
        masterProfile:
          type: string
          enum: [STREAMING, DYNAMIC, CLASSICAL, POP, LOUD, FILM]
    MixMasterTrackControl:
      type: object
      required: [levelDb, pan, bus, sendDb, processing]
      properties:
        levelDb: { type: number, minimum: -60, maximum: 12 }
        pan: { type: number, minimum: -1, maximum: 1 }
        bus: { type: string, enum: [MIX, DRUMS, MUSIC, VOCALS, FX] }
        sendDb: { type: number, minimum: -80, maximum: 6 }
        processing:
          type: object
          required: [highPassHz, compressorRatio, saturation]
          properties:
            highPassHz: { type: number, minimum: 20, maximum: 20000 }
            compressorRatio: { type: number, minimum: 1, maximum: 20 }
            saturation: { type: number, minimum: 0, maximum: 1 }
    MixMasterRevisionInput:
      type: object
      required: [arrangementId, tracks, master]
      properties:
        arrangementId: { type: string, minLength: 1 }
        tracks:
          type: object
          additionalProperties: { $ref: "#/components/schemas/MixMasterTrackControl" }
        master:
          type: object
          required: [targetLufs, truePeakDbtp, processing]
          properties:
            targetLufs: { type: number, minimum: -24, maximum: -6 }
            truePeakDbtp: { type: number, minimum: -6, maximum: -0.1 }
            processing:
              type: object
              required: [limiter, stereoWidth]
              properties:
                limiter: { type: boolean }
                stereoWidth: { type: number, minimum: 0, maximum: 2 }
    MixMasterFinding:
      type: object
      required: [id, severity, message, control, startSeconds, endSeconds]
      properties:
        id: { type: string }
        severity: { type: string, enum: [info, warning, error] }
        message: { type: string }
        control: { type: string }
        startSeconds: { type: number, minimum: 0 }
        endSeconds: { type: number, minimum: 0 }
    MixMasterPreviewVariant:
      type: object
      required: [url, timelineSha256, durationSeconds]
      properties:
        url: { type: string }
        timelineSha256: { type: string }
        durationSeconds: { type: number, minimum: 0 }
        sourceId: { type: string }
        artifactId: { type: string }
        checksum: { type: string }
    MixMasterRevision:
      type: object
      required: [id, projectId, arrangementId, version, controls, previewUrl, variants, evidence, approvedAt, approvedBy, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        arrangementId: { type: string }
        version: { type: number }
        controls:
          type: object
          required: [tracks, master]
          properties:
            tracks:
              type: object
              additionalProperties: { $ref: "#/components/schemas/MixMasterTrackControl" }
            master:
              type: object
              required: [targetLufs, truePeakDbtp, processing]
              properties:
                targetLufs: { type: number }
                truePeakDbtp: { type: number }
                processing:
                  type: object
                  required: [limiter, stereoWidth]
                  properties:
                    limiter: { type: boolean }
                    stereoWidth: { type: number }
        previewUrl: { type: string }
        variants:
          type: object
          required: [original, repaired, mixed, mastered]
          properties:
            original:
              oneOf: [{ $ref: "#/components/schemas/MixMasterPreviewVariant" }, { type: "null" }]
            repaired:
              oneOf: [{ $ref: "#/components/schemas/MixMasterPreviewVariant" }, { type: "null" }]
            mixed: { $ref: "#/components/schemas/MixMasterPreviewVariant" }
            mastered: { $ref: "#/components/schemas/MixMasterPreviewVariant" }
        evidence:
          type: object
          required: [arrangementId, arrangementVersion, songModelVersion, timelineSha256, artifactIds, variants, renderer, quality]
          properties:
            arrangementId: { type: string }
            arrangementVersion: { type: number }
            songModelVersion: { type: ["number", "null"] }
            timelineSha256: { type: string }
            artifactIds: { type: array, items: { type: string } }
            variants:
              type: object
              required: [original, repaired, mixed, mastered]
              properties:
                original:
                  oneOf: [{ $ref: "#/components/schemas/MixMasterPreviewVariant" }, { type: "null" }]
                repaired:
                  oneOf: [{ $ref: "#/components/schemas/MixMasterPreviewVariant" }, { type: "null" }]
                mixed: { $ref: "#/components/schemas/MixMasterPreviewVariant" }
                mastered: { $ref: "#/components/schemas/MixMasterPreviewVariant" }
            renderer: { type: string }
            quality:
              type: object
              required: [integratedLufs, truePeakDbtp, truePeakMethod, findings]
              properties:
                integratedLufs: { type: number }
                truePeakDbtp: { type: number }
                truePeakMethod: { type: string, enum: [4x-windowed-sinc-estimate] }
                findings: { type: array, items: { $ref: "#/components/schemas/MixMasterFinding" } }
        approvedAt: { type: ["string", "null"] }
        approvedBy: { type: ["string", "null"] }
        createdAt: { type: string }
    ProductionJob:
      type: object
      required: [id, projectId, kind, status, stage, progress, attempt, maxAttempts, retryable, outputArtifactIds, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        kind: { type: string, enum: [analysis, separation, transcription, arrangement, rendering, mixing, mastering, quality, export] }
        status: { type: string, enum: [queued, running, succeeded, failed, cancel_requested, cancelled] }
        stage: { type: string }
        progress: { type: number }
        attempt: { type: number }
        maxAttempts: { type: number }
        retryable: { type: boolean }
        error:
          type: [object, "null"]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
        outputArtifactIds:
          type: array
          items: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        completedAt: { type: ["string", "null"] }
    ExportResult:
      type: object
      required: [id, status, files, bundleUrl, createdAt]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [ready]
        files:
          type: array
          items:
            $ref: "#/components/schemas/ExportFile"
        bundleUrl: { type: string }
        createdAt: { type: string }
    ExportFile:
      type: object
      required: [name, type, size, format, url]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [STEM, MIDI, MIX, PREMASTER, MASTER, METADATA, BUNDLE, SONG_MODEL, ARRANGEMENT_PLAN, EXPORT]
        size: { type: string }
        format: { type: string }
        url: { type: string }
    ExportPackage:
      type: object
      required: [id, projectId, version, status, filename, size, createdAt, url, files]
      properties:
        id: { type: string }
        projectId: { type: string }
        version: { type: number }
        status:
          type: string
          enum: [ready]
        filename: { type: string }
        size: { type: string }
        createdAt: { type: string }
        url: { type: string }
        files:
          type: array
          items:
            $ref: "#/components/schemas/ExportFile"
    TempoMapEvent:
      type: object
      required: [tick, bpm]
      properties:
        tick: { type: number }
        bpm: { type: number }
    MeterMapEvent:
      type: object
      required: [tick, numerator, denominator]
      properties:
        tick: { type: number }
        numerator: { type: number }
        denominator: { type: number }
    MidiNote:
      type: object
      required: [startTick, durationTicks, pitch, velocity]
      properties:
        startTick: { type: number }
        durationTicks: { type: number }
        pitch: { type: number }
        velocity: { type: number }
    ExpressionEvent:
      type: object
      required: [tick, value]
      properties:
        tick: { type: number }
        value: { type: number }
    ArticulationEvent:
      type: object
      required: [tick, type, keyswitch]
      properties:
        tick: { type: number }
        type: { type: string }
        keyswitch: { type: number }
    TrackPerformance:
      type: object
      required: [tempoMap, meterMap, notes, expression, articulations]
      properties:
        tempoMap:
          type: array
          items:
            $ref: "#/components/schemas/TempoMapEvent"
        meterMap:
          type: array
          items:
            $ref: "#/components/schemas/MeterMapEvent"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/MidiNote"
        expression:
          type: array
          items:
            $ref: "#/components/schemas/ExpressionEvent"
        articulations:
          type: array
          items:
            $ref: "#/components/schemas/ArticulationEvent"
        performedMaterialSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    Track:
      type: object
      required: [id, projectId, name, role, kind, color, volume, muted, solo, status, performance]
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        role: { type: string }
        kind:
          type: string
          enum: [audio, midi]
        color: { type: string }
        volume: { type: number }
        muted: { type: boolean }
        solo: { type: boolean }
        status:
          type: string
          enum: [source, generated, rendered]
        performance:
          $ref: "#/components/schemas/TrackPerformance"
        instrumentDefinition:
          $ref: "#/components/schemas/InstrumentDefinition"
        trackModel:
          $ref: "#/components/schemas/TrackModel"
        provenance:
          $ref: "#/components/schemas/ArtifactProvenance"
    Artifact:
      type: object
      required: [id, projectId, type, label, version, size, format, state, parentIds, technicalMetadata, retentionPolicy, immutable, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        type:
          type: string
          enum: [SOURCE, NORMALIZED_AUDIO, STEM, ANALYSIS, SONG_MODEL, ARRANGEMENT_PLAN, TRACK_MODEL, MIDI, AUDIO_TRACK, QUALITY_REPORT, MIX, MASTER, EXPORT]
        label: { type: string }
        version: { type: number }
        size: { type: string }
        format: { type: string }
        state:
          type: string
          enum: [rendering, ready, failed, expired]
        createdAt: { type: string }
        url: { type: ["string", "null"] }
        checksum: { type: ["string", "null"] }
        parentIds:
          type: array
          items: { type: string }
        createdBy: { type: ["string", "null"] }
        modelVersion: { type: ["string", "null"] }
        storageUri: { type: ["string", "null"] }
        technicalMetadata:
          type: object
          additionalProperties: true
        provider: { type: ["string", "null"] }
        license: { type: ["string", "null"] }
        retentionPolicy: { type: string }
        expiresAt: { type: ["string", "null"] }
        immutable: { type: boolean }
    CopilotInput:
      type: object
      required: [command]
      properties:
        command: { type: string, minLength: 1 }
        arrangementId: { type: string }
        targetSection: { type: string }
        targetTrack: { type: string }
        startBar: { type: number, minimum: 1 }
        endBar: { type: number, minimum: 1 }
    CopilotResult:
      type: object
      required: [reply, operations, affectedSections, interpreter]
      properties:
        reply: { type: string }
        operations:
          type: array
          items:
            $ref: "#/components/schemas/CopilotOperation"
        affectedSections:
          type: array
          items: { type: string }
        interpreter:
          type: string
          enum: [openai, deterministic]
    CopilotOperation:
      type: object
      required: [type, label]
      properties:
        type: { type: string }
        label: { type: string }
        targetSection: { type: string }
        targetTrack: { type: string }
        startBar: { type: number, minimum: 1 }
        endBar: { type: number, minimum: 1 }
    ArtifactProvenance:
      type: object
      required: [model, version, parameters, parentIds, createdBy]
      properties:
        model: { type: string }
        version: { type: string }
        parameters: { type: object, additionalProperties: { oneOf: [{ type: string }, { type: number }, { type: boolean }] } }
        parentIds: { type: array, items: { type: string } }
        createdBy: { type: string }
    MusicalNote:
      type: object
      required: [id, start, duration, pitch, velocity]
      properties:
        id: { type: string }
        start: { type: number }
        duration: { type: number }
        pitch: { type: number }
        velocity: { type: number }
        channel: { type: number }
        voice: { type: string }
    ControlEvent:
      type: object
      required: [controller, time, value]
      properties:
        controller: { type: number }
        time: { type: number }
        value: { type: number }
        channel: { type: number }
    TrackAutomationPoint:
      type: object
      required: [parameter, time, value]
      properties:
        parameter: { type: string }
        time: { type: number }
        value: { type: number }
    InstrumentDefinition:
      type: object
      required: [id, family, playableRange, comfortableRange, registers, polyphonic, maxVoices, articulations, constraints, controls]
      properties:
        id: { type: string }
        family: { type: string, enum: [keys, strings, brass, drums, guitar, voice, synth] }
        playableRange: { type: object, required: [min, max], properties: { min: { type: number }, max: { type: number } } }
        comfortableRange: { type: object, required: [min, max], properties: { min: { type: number }, max: { type: number } } }
        registers: { type: array, items: { type: object, required: [name, min, max, character], properties: { name: { type: string }, min: { type: number }, max: { type: number }, character: { type: string } } } }
        polyphonic: { type: boolean }
        maxVoices: { type: number }
        articulations: { type: array, items: { type: string } }
        constraints:
          type: object
          required: [maxLeap, minNoteDuration, maxSimultaneousNotes]
          properties:
            maxLeap: { type: number }
            minNoteDuration: { type: number }
            maxSimultaneousNotes: { type: number }
            breathSeconds: { type: number }
            strings: { type: number }
            frets: { type: number }
            hands: { type: number }
            feet: { type: number }
        controls:
          type: object
          required: [dynamics, expression, pitchBend, aftertouch]
          properties:
            dynamics: { type: array, items: { type: number } }
            expression: { type: array, items: { type: number } }
            sustain: { type: number }
            pitchBend: { type: boolean }
            aftertouch: { type: boolean }
        directiveMappings:
          $ref: "#/components/schemas/InstrumentDirectiveMappings"
    TrackModel:
      type: object
      required: [id, instrument, instrumentDefinition, role, notes, cc, articulations, automation, source, version, provenance]
      properties:
        id: { type: string }
        instrument: { type: string }
        instrumentDefinition: { $ref: "#/components/schemas/InstrumentDefinition" }
        role: { type: string }
        notes: { type: array, items: { $ref: "#/components/schemas/MusicalNote" } }
        cc: { type: array, items: { $ref: "#/components/schemas/ControlEvent" } }
        articulations: { type: array, items: { $ref: "#/components/schemas/ArticulationEvent" } }
        automation: { type: array, items: { $ref: "#/components/schemas/TrackAutomationPoint" } }
        source: { type: string }
        version: { type: number }
        provenance: { $ref: "#/components/schemas/ArtifactProvenance" }
        directive:
          $ref: "#/components/schemas/TrackDirective"
        appliedDirectives:
          type: array
          items:
            $ref: "#/components/schemas/AppliedTrackDirective"
        mapping:
          $ref: "#/components/schemas/TrackMappingMetadata"
        performanceEvidence:
          $ref: "#/components/schemas/TrackPerformanceEvidence"
        harmonyEvidence:
          $ref: "#/components/schemas/TrackHarmonyEvidence"
    TrackHarmonyEvidence:
      type: object
      required: [version, mode, melodyEvidencePreserved, bassEvidencePreserved]
      properties:
        version: { type: string, enum: ["2.0"] }
        mode: { type: string, enum: [advanced_voicing, phrase_countermelody] }
        selectedMotion: { type: number, minimum: 0 }
        baselineMotion: { type: number, minimum: 0 }
        maximumLeap: { type: number, minimum: 0 }
        motifRefs: { type: array, items: { type: string } }
        resolutionObligations: { type: number, minimum: 0 }
        melodyEvidencePreserved: { type: boolean }
        bassEvidencePreserved: { type: boolean }
    TrackPerformanceEvidence:
      type: object
      required:
        - version
        - seed
        - instrumentFamily
        - articulationProfile
        - timingProfile
        - dynamicsProfile
        - canonicalTimelineSha256
        - phraseIds
        - sectionRanges
        - playability
        - performedMaterialSha256
      properties:
        version: { type: string, enum: ["1.0"] }
        seed: { type: number }
        instrumentFamily:
          type: string
          enum: [keys, strings, brass, drums, guitar, voice, synth]
        articulationProfile: { type: string }
        timingProfile: { type: string }
        dynamicsProfile: { type: string }
        canonicalTimelineSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        phraseIds: { type: array, items: { type: string } }
        sectionRanges:
          type: array
          items:
            type: object
            required: [section, startBar, endBar, start, end]
            properties:
              section: { type: string }
              startBar: { type: number }
              endBar: { type: number }
              start: { type: number }
              end: { type: number }
        playability:
          type: object
          required: [valid, checkedNotes, violations]
          properties:
            valid: { type: boolean }
            checkedNotes: { type: number }
            violations: { type: array, items: { type: string } }
        performedMaterialSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    StyleGrammar:
      type: object
      required: [version, evidenceSha256, vocabulary]
      properties:
        version: { type: string, const: "1.0" }
        evidenceSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        vocabulary:
          type: object
          required: [groove, voicing, articulation, instrumentation, phraseBehavior, fills, transitions, development]
          properties:
            groove: { type: string, enum: [straight, swung, syncopated, four_on_floor] }
            voicing: { type: string, enum: [close, open, drop_two, quartal, wide] }
            articulation: { type: string, enum: [legato, tight, accented, pulsed] }
            instrumentation: { type: string, enum: [acoustic, electronic, hybrid, orchestral] }
            phraseBehavior: { type: string, enum: [call_response, continuous, sparse_answers, motivic] }
            fills: { type: string, enum: [none, cadential, frequent, sectional] }
            transitions: { type: string, enum: [hard_cut, thin_build, riser, orchestral_swell] }
            development: { type: string, enum: [repetition, additive, transformative, dynamic_arc] }
    StyleSpec:
      type: object
      required: [genre, subgenre, era, tempoCharacter, rhythm, harmony, instrumentation, orchestration, production, dynamics]
      properties:
        genre: { type: string }
        subgenre: { type: string }
        era: { type: string }
        tempoCharacter: { type: string, enum: [laid_back, steady, driving, rubato] }
        rhythm: { type: object }
        harmony: { type: object }
        instrumentation: { type: object }
        orchestration: { type: object }
        production: { type: object }
        dynamics: { type: object }
        grammar: { $ref: "#/components/schemas/StyleGrammar" }
    ArrangementPlanSection:
      type: object
      required: [section, startBar, endBar, energy, density, tracks, operations]
      properties:
        section: { type: string }
        startBar: { type: number }
        endBar: { type: number }
        energy: { type: number }
        density: { type: number }
        tracks: { type: object, additionalProperties: { type: string } }
        operations: { type: array, items: { type: string } }
        activeTracks:
          type: array
          description: Explicit track ids active in this section.
          items: { type: string }
        trackDirectives:
          type: object
          description: Per-track orchestration intent indexed by track id.
          additionalProperties:
            $ref: "#/components/schemas/TrackDirective"
    ArrangementHierarchyScope:
      type: object
      required: [level, id]
      properties:
        level: { type: string, enum: [song, section, phrase, bar, event] }
        id: { type: string }
    ArrangementHierarchy:
      type: object
      required: [version, status, reason, precedence, song, sections, phrases, bars, events]
      properties:
        version: { type: string, const: "1.0" }
        status: { type: string, enum: [applied, no_op] }
        reason: { type: [string, "null"] }
        precedence:
          type: array
          prefixItems:
            - { type: string, const: song }
            - { type: string, const: section }
            - { type: string, const: phrase }
            - { type: string, const: bar }
            - { type: string, const: event }
          minItems: 5
          maxItems: 5
        song:
          type: object
          required: [id, intent, climaxSectionId]
          properties:
            id: { type: string }
            intent: { type: string, enum: [development_arc, preserve_observed_form] }
            climaxSectionId: { type: [string, "null"] }
        sections:
          type: array
          items:
            type: object
            required: [id, sourceSection, startBar, endBar, function, development, targetEnergy, targetDensity, phraseIds, barIds]
            properties:
              id: { type: string }
              sourceSection: { type: string }
              startBar: { type: number, minimum: 1 }
              endBar: { type: number, minimum: 1 }
              function: { type: string, enum: [intro, verse, prechorus, chorus, bridge, outro, neutral] }
              development: { type: string, enum: [initial, development, reprise, neutral] }
              targetEnergy: { type: number, minimum: 0, maximum: 1 }
              targetDensity: { type: number, minimum: 0, maximum: 1 }
              phraseIds: { type: array, items: { type: string } }
              barIds: { type: array, items: { type: string } }
        phrases:
          type: array
          items:
            type: object
            required: [id, sectionId, startBar, endBar, confidence, intent]
            properties:
              id: { type: string }
              sectionId: { type: string }
              startBar: { type: number, minimum: 1 }
              endBar: { type: number, minimum: 1 }
              confidence: { type: number, minimum: 0, maximum: 1 }
              intent: { type: string, const: protect_vocal_phrase }
        bars:
          type: array
          items:
            type: object
            required: [id, sectionId, bar, meter, phraseIds, vocalSpace]
            properties:
              id: { type: string }
              sectionId: { type: string }
              bar: { type: number, minimum: 1 }
              meter: { type: string }
              phraseIds: { type: array, items: { type: string } }
              vocalSpace: { type: string, enum: [occupied, available, unknown] }
        events:
          type: array
          items:
            type: object
            required: [id, sectionId, barId, trackId, intent, source]
            properties:
              id: { type: string }
              sectionId: { type: string }
              barId: { type: string }
              trackId: { type: string }
              intent: { type: string, enum: [support_vocal, use_vocal_space, follow_section] }
              source: { type: string, enum: [section, vocal_phrase, vocal_space] }
    OrchestrationCue:
      type: object
      properties:
        bar: { type: number, minimum: 0 }
        beat: { type: number, minimum: 0 }
        mode: { type: string }
        durationBeats: { type: number, exclusiveMinimum: 0 }
    TrackDirective:
      type: object
      properties:
        role: { type: string }
        musicalFunction:
          type: string
          enum: [foundation, pulse, groove, harmonic_support, texture, countermelody, hook, response, lift, transition, accent, doubling, pad]
        register: { type: string }
        rhythmicActivity: { type: number, minimum: 0, maximum: 1 }
        harmonicActivity: { type: number, minimum: 0, maximum: 1 }
        dynamicTarget: { type: number, minimum: 0, maximum: 1 }
        articulationFamily: { type: string }
        entry: { $ref: "#/components/schemas/OrchestrationCue" }
        exit: { $ref: "#/components/schemas/OrchestrationCue" }
        transition: { type: string }
        fill: { type: boolean }
        handoffFromTrackId: { type: string }
        doublingTrackId: { type: string }
    OrchestrationAssignment:
      type: object
      required: [sectionId, phraseId, trackId, role, register, handoffFromTrackId, doublingTrackId]
      properties:
        sectionId: { type: string }
        phraseId: { type: string }
        trackId: { type: string }
        role:
          type: string
          enum: [foundation, pulse, groove, harmonic_support, texture, countermelody, hook, response, lift, transition, accent, doubling, pad]
        register: { type: string, enum: [low, middle, high] }
        handoffFromTrackId: { type: [string, "null"] }
        doublingTrackId: { type: [string, "null"] }
    CompositionIntelligencePlan:
      type: object
      required: [version, mode, precedence, seed, evidenceSha256, songIntent, tensionRelease, phrases, instrumentRoles]
      properties:
        version: { type: string, enum: ["1.0", "2.0"] }
        mode: { type: string, enum: [legacy, reasoning_core] }
        precedence:
          type: array
          items: { type: string }
        seed: { type: number }
        evidenceSha256: { type: string }
        songIntent: { type: string, enum: [preserve_observed_form, develop_observed_form] }
        tensionRelease:
          type: array
          items: { type: object }
        phrases:
          type: array
          items: { type: object }
        instrumentRoles:
          type: array
          items: { type: object }
        orchestrationAssignments:
          type: array
          items: { $ref: "#/components/schemas/OrchestrationAssignment" }
    AppliedTrackDirective:
      type: object
      required: [section, startBar, endBar, start, end, directive]
      properties:
        section: { type: string }
        startBar: { type: number, minimum: 1 }
        endBar: { type: number, minimum: 1 }
        start: { type: number, minimum: 0 }
        end: { type: number, minimum: 0 }
        directive:
          $ref: "#/components/schemas/TrackDirective"
    TrackMappingMetadata:
      type: object
      properties:
        midiChannel: { type: number, minimum: 1, maximum: 16 }
        program: { type: number, minimum: 0, maximum: 127 }
        articulationMap:
          type: object
          additionalProperties:
            oneOf: [{ type: string }, { type: number }]
        controlMap:
          type: object
          additionalProperties: { type: number }
    InstrumentDirectiveMappings:
      type: object
      properties:
        registers:
          type: object
          additionalProperties:
            type: object
            required: [min, max]
            properties:
              min: { type: number }
              max: { type: number }
        articulationFamilies:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        dynamicTargets:
          type: object
          additionalProperties: { type: number }
        controls:
          type: object
          additionalProperties: { type: number }
    GenerationPreferenceEffects:
      type: object
      required: [orchestrationDensity, responseFrequency, roleEmphasis, voicingCharacter, development, transitionIntensity]
      properties:
        orchestrationDensity: { type: number, minimum: -0.35, maximum: 0.35 }
        responseFrequency: { type: number, minimum: 0.25, maximum: 0.75 }
        roleEmphasis: { type: string, enum: [foundation, pulse, harmony, counterline, texture] }
        voicingCharacter: { type: string, enum: [close, open, wide] }
        development: { type: string, enum: [restrained, balanced, progressive] }
        transitionIntensity: { type: number, minimum: 0.25, maximum: 0.75 }
    GenerationPreferenceSnapshot:
      type: object
      required: [contractVersion, calibrationId, calibrationVersion, heldOutAgreement, baselineAgreement, heldOutExamples, evaluationSha256, evidenceSha256, effects]
      properties:
        contractVersion: { type: string, const: "1.0" }
        calibrationId: { type: string, minLength: 1 }
        calibrationVersion: { type: number, minimum: 1, multipleOf: 1 }
        heldOutAgreement: { type: number, minimum: 0, maximum: 1 }
        baselineAgreement: { type: number, minimum: 0, maximum: 1 }
        heldOutExamples: { type: number, minimum: 5, multipleOf: 1 }
        evaluationSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        evidenceSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        effects: { $ref: "#/components/schemas/GenerationPreferenceEffects" }
    ArrangementPlan:
      type: object
      required: [id, version, sections, style, songModelVersion, parameters, provenance, hierarchy]
      properties:
        id: { type: string }
        version: { type: number }
        sections: { type: array, items: { $ref: "#/components/schemas/ArrangementPlanSection" } }
        style: { $ref: "#/components/schemas/StyleSpec" }
        songModelVersion: { type: number }
        parameters: { type: object }
        provenance: { $ref: "#/components/schemas/ArtifactProvenance" }
        hierarchy: { $ref: "#/components/schemas/ArrangementHierarchy" }
        compositionIntelligence: { $ref: "#/components/schemas/CompositionIntelligencePlan" }
        generationPreference:
          oneOf:
            - { $ref: "#/components/schemas/GenerationPreferenceSnapshot" }
            - { type: "null" }
