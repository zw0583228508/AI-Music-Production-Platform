              items:
                type: object
                required: [id, name, role, kind]
                properties:
                  id: { type: string }
                  name: { type: string }
                  role: { type: string }
                  kind: { type: string }
        trackModels:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/TrackModel"
        evaluation:
          $ref: "#/components/schemas/CandidateEvaluation"
        createdAt: { type: string }
    GenerationProvider:
      type: object
      required: [id, name, modelVersion, tasks, hardware, speeds, available, status, configured, checkpointReady, runtimeReady, smokeTested, reportedVersion, lastHealth]
      properties:
        id:
          type: string
          enum: [BS_ROFORMER, ALL_IN_ONE, MT3, BASIC_PITCH, ACE_STEP, MUSICGEN, ANYACCOMP, SYMPHONYGEN, METEOR, MIDI_SAG]
        name: { type: string }
        modelVersion: { type: string }
        tasks:
          type: array
          items:
            type: string
            enum: [SEPARATION, TRANSCRIPTION, ACCOMPANIMENT, ORCHESTRATION, ARRANGEMENT]
        hardware:
          type: array
          items:
            type: string
            enum: [CPU, GPU]
        speeds:
          type: array
          items:
            type: string
            enum: [FAST, BALANCED, QUALITY]
        available: { type: boolean }
        status:
          type: string
          enum: [ready, configured, unavailable]
        configured: { type: boolean }
        checkpointReady: { type: boolean }
        runtimeReady: { type: boolean }
        smokeTested:
          type: boolean
          description: True only when the worker's live health response proves a real smoke inference completed.
        reportedVersion:
          type: [string, "null"]
        reportedChecksum:
          type: [string, "null"]
        runtimeProvenance:
          oneOf:
            - $ref: "#/components/schemas/ProviderRuntimeProvenance"
            - type: "null"
        lastHealth:
          $ref: "#/components/schemas/ProviderHealthResult"
    ProviderHealthResult:
      type: object
      required: [status, checkedAt, latencyMs, message]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, unknown]
        checkedAt:
          type: [string, "null"]
        latencyMs:
          type: [number, "null"]
        message:
          type: [string, "null"]
    ProviderRuntimeSnapshot:
      type: object
      required: [availability, configurationReady, checkpointReady, runtimeReady, smokeTested, healthStatus, checkedAt, latencyMs, message, reportedVersion]
      properties:
        availability:
          type: string
          enum: [ready, configured, unavailable]
        configurationReady: { type: boolean }
        checkpointReady: { type: boolean }
        runtimeReady: { type: boolean }
        smokeTested: { type: boolean }
        healthStatus:
          type: string
          enum: [healthy, unhealthy, unknown]
        checkedAt:
          type: [string, "null"]
        latencyMs:
          type: [number, "null"]
        message:
          type: [string, "null"]
        reportedVersion:
          type: [string, "null"]
        reportedChecksum:
          type: [string, "null"]
        runtimeProvenance:
          oneOf:
            - $ref: "#/components/schemas/ProviderRuntimeProvenance"
            - type: "null"
    ProviderRuntimeProvenance:
      type: object
      description: Immutable worker attestation captured from live health and required to match the completion payload. The Modal image ID is the independently promoted runtime identity; the source image digest is retained as an additional compatibility check.
      required: [model, checkpointSha256, revision, modalImageId, sourceImageDigest, cudaVersion, pytorchVersion, gpu]
      properties:
        model: { type: string }
        checkpointSha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
        revision: { type: string }
        modalImageId: { type: string, pattern: "^im-[A-Za-z0-9]+$" }
        sourceImageDigest: { type: string, pattern: "^sha256:[a-fA-F0-9]{64}$" }
        cudaVersion: { type: string }
        pytorchVersion: { type: string }
        gpu: { type: string }
    GenerationResult:
      type: object
      required: [arrangement, candidates, selectedCandidate, provider]
      properties:
        arrangement:
          $ref: "#/components/schemas/Arrangement"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
        selectedCandidate: { type: string }
        provider:
          $ref: "#/components/schemas/MusicProvider"
    Candidate:
      type: object
      required: [id, label, score, summary, provider]
      properties:
        id: { type: string }
        label: { type: string }
        score: { type: number }
        summary: { type: string }
        provider: { type: string }
    ExportInput:
      type: object
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
