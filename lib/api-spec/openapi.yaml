        findingId: { type: string }
        seed: { type: number, minimum: 0, maximum: 2147483647 }
        attempt: { type: number, minimum: 1 }
        maxAttempts: { type: number, minimum: 1 }
        scope:
          type: object
          required: [affectedSections, startBar, endBar, affectedTrackIds]
          properties:
            affectedSections: { type: array, items: { type: string } }
            startBar: { type: number, minimum: 1 }
            endBar: { type: number, minimum: 1 }
            affectedTrackIds: { type: array, items: { type: string } }
        musicalReason: { type: string }
        outsideScopePreserved: { type: boolean }
        changedScopes:
          type: array
          items:
            $ref: "#/components/schemas/ArrangementHierarchyScope"
        sourceQualityScore: { type: number, minimum: 0, maximum: 1 }
        repairedQualityScore: { type: [number, "null"], minimum: 0, maximum: 1 }
        improved: { type: boolean }
