        energy: { type: number }
        density: { type: number }
        tracks:
          type: array
          items: { type: string }
        startBar: { type: number }
        endBar: { type: number }
        chords:
          type: array
          items:
            $ref: "#/components/schemas/EditorChordEvent"
        markers:
