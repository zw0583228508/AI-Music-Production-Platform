                type: string
                enum: [AUDIO_TRACK, MIDI, QUALITY_REPORT]
              label: { type: string }
              url: { type: string }
        qualityReport:
          oneOf:
            - $ref: "#/components/schemas/CandidateQualityReport"
            - type: "null"
        error:
          type: [string, "null"]
    GenerationCandidate:
      type: object
      required: [id, jobId, provider, modelVersion, seed, rank, label, score, confidence, summary, status, parameters, parentArtifactIds, plan, trackModels, evaluation, createdAt]
      properties:
        id: { type: string }
        jobId: { type: string }
        provider:
          type: string
          enum: [BS_ROFORMER, ALL_IN_ONE, MT3, BASIC_PITCH, ACE_STEP, MUSICGEN, ANYACCOMP, SYMPHONYGEN, METEOR, MIDI_SAG]
        modelVersion: { type: string }
        reportedModelVersion:
          type: [string, "null"]
        providerRequestId:
          type: [string, "null"]
        seed: { type: number }
        rank:
