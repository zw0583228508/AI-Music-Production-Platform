openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for the AI Music Production Studio
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Studio dashboard summaries
  - name: projects
    description: Song projects and analysis
  - name: arrangements
    description: Arrangement plans and generations
  - name: studio
    description: Tracks, artifacts, and copilot commands
  - name: Auth
    description: Browser authentication
  - name: sources
    description: Source upload, preprocessing, and Song Model generation
  - name: providers
    description: Music model registry and provider capability routing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get studio dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the current authentication state
      responses:
        "200":
          description: Authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start browser login
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect to identity provider }
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete browser login
      responses:
        "302": { description: Redirect after login }
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: End browser session
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect after logout }
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile authorization code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /storage/uploads/request-url:
    post:
      tags: [sources]
      operationId: requestSourceUploadUrl
      summary: Request a protected direct-upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Direct upload target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "401":
          description: Login required
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List music projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a music project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project workspace data
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWorkspace"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/analyze:
    post:
      operationId: analyzeProject
      tags: [projects]
      summary: Analyze the latest imported source recording
      description: Creates and awaits a durable analysis attempt for the authenticated project owner.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisInput"
      responses:
        "200":
          description: Completed analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "401":
          description: Login required
        "403":
          description: Project is owned by another user
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An analysis is already queued or running
        "422":
          description: Analysis completed with a failure
  /projects/{projectId}/sources:
    get:
      operationId: listProjectSources
      tags: [sources]
      summary: List imported source recordings
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Source recordings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSource"
    post:
      operationId: registerProjectSource
      tags: [sources]
      summary: Register an uploaded source and begin analysis
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSourceInput"
      responses:
        "202":
          description: Source accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSource"
        "401":
          description: Login required
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/sources/{sourceId}/retry:
    post:
      operationId: retryProjectSourceAnalysis
      tags: [sources]
      summary: Retry a failed source analysis
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Source accepted for another analysis attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSource"
        "400":
          description: Invalid retry request
        "401":
          description: Login required
        "403":
          description: Forbidden
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Source analysis is already in progress
  /projects/{projectId}/song-model:
    get:
      operationId: getProjectSongModel
      tags: [sources]
      summary: Get the latest canonical Song Model
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Latest Song Model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongModel"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: correctProjectSongModel
      tags: [sources]
      summary: Create a corrected Song Model version
      description: Creates an auditable immutable revision of the latest Song Model and updates the project analysis summary atomically. Omitted fields remain unchanged.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SongModelCorrectionInput"
      responses:
        "200":
          description: Corrected Song Model revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongModel"
        "400":
          description: Invalid correction
        "401":
          description: Login required
        "403":
          description: Project is owned by another user
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/analysis-jobs:
    get:
      operationId: listAnalysisJobs
      tags: [sources]
      summary: List durable analysis attempts for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Analysis job attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisJob"
  /providers:
    get:
      operationId: listMusicProviders
      tags: [providers]
      summary: List registered music providers and availability
      responses:
        "200":
          description: Model registry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MusicProvider"
  /projects/{projectId}/arrangements:
    get:
      operationId: listArrangements
      tags: [arrangements]
      summary: List arrangement versions
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Arrangement versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Arrangement"
    post:
      operationId: createArrangement
      tags: [arrangements]
      summary: Create an arrangement plan
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArrangementInput"
      responses:
        "201":
          description: Created arrangement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Arrangement"
  /arrangements/{arrangementId}:
    patch:
      operationId: updateArrangement
      tags: [arrangements]
      summary: Update arrangement controls
      parameters:
        - $ref: "#/components/parameters/ArrangementId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArrangementUpdate"
      responses:
        "200":
          description: Updated arrangement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Arrangement"
        "404":
          $ref: "#/components/responses/NotFound"
  /arrangements/{arrangementId}/generate:
    post:
      operationId: generateArrangement
      tags: [arrangements]
      summary: Queue provider-backed arrangement generation
      parameters:
        - $ref: "#/components/parameters/ArrangementId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationInput"
      responses:
        "202":
          description: Generation job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Generation blocked because the Song Model is missing, invalid, flagged, or unreliable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationBlockedError"
        "503":
          description: No compatible provider worker is available
  /generation-jobs/{jobId}:
    get:
      operationId: getGenerationJob
      tags: [arrangements]
      summary: Get live provider generation progress
      parameters:
        - $ref: "#/components/parameters/GenerationJobId"
      responses:
        "200":
          description: Current generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
        "404":
          $ref: "#/components/responses/NotFound"
  /generation-jobs/{jobId}/candidates:
    get:
      operationId: listGenerationCandidates
      tags: [arrangements]
      summary: List ranked provider generation candidates
      parameters:
        - $ref: "#/components/parameters/GenerationJobId"
      responses:
        "200":
          description: Ranked generated candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GenerationCandidate"
        "404":
          $ref: "#/components/responses/NotFound"
  /generation-candidates/{candidateId}/select:
    post:
      operationId: selectGenerationCandidate
      tags: [arrangements]
      summary: Select a validated candidate as a new arrangement version
      parameters:
        - $ref: "#/components/parameters/GenerationCandidateId"
      responses:
        "200":
          description: Newly selected arrangement version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Arrangement"
        "404":
          $ref: "#/components/responses/NotFound"
  /music-providers:
    get:
      operationId: listGenerationProviders
      tags: [arrangements]
      summary: List generation provider capabilities and availability
      responses:
        "200":
          description: Generation provider catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GenerationProvider"
  /arrangements/{arrangementId}/export:
    post:
      operationId: exportArrangement
      tags: [studio]
      deprecated: true
      summary: Compatibility alias for the durable project export pipeline
      parameters:
        - $ref: "#/components/parameters/ArrangementId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportInput"
      responses:
        "200":
          description: Completed durable export package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPackage"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/tracks:
    get:
      operationId: listTracks
      tags: [studio]
      summary: List project tracks
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Track list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"
  /projects/{projectId}/artifacts:
    get:
      operationId: listArtifacts
      tags: [studio]
      summary: List project artifacts
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Artifact list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artifact"
  /projects/{projectId}/export:
    post:
      operationId: createProjectExport
      tags: [studio]
      summary: Render and package a versioned project export
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportInput"
      responses:
        "201":
          description: Created export package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPackage"
        "404":
          $ref: "#/components/responses/NotFound"
  /exports/{exportId}/download:
    get:
      operationId: downloadProjectExport
      tags: [studio]
      summary: Download a project export ZIP
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: ZIP archive containing playable project files
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/copilot:
    post:
      operationId: runCopilot
      tags: [studio]
      summary: Interpret an arranger copilot command
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotInput"
      responses:
        "200":
          description: Parsed copilot operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotResult"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    ArrangementId:
      name: arrangementId
      in: path
      required: true
      schema:
        type: string
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
    GenerationJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    GenerationCandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        type: string
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: ["string", "null"] }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        profileImageUrl: { type: ["string", "null"] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code: { type: string, minLength: 1 }
        code_verifier: { type: string, minLength: 1 }
        redirect_uri: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        nonce: { type: string }
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: number, minimum: 1, maximum: 524288000 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath, metadata]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    RegisterSourceInput:
      type: object
      required: [objectPath, name, size, contentType, sourceType]
      properties:
        objectPath: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        size: { type: number, minimum: 1, maximum: 524288000 }
        contentType: { type: string, minLength: 1 }
        sourceType:
          type: string
          enum: [FULL_SONG, VOCAL_ONLY, SOLO_INSTRUMENT, INSTRUMENTAL, MIDI, VIDEO]
    AnalysisAttempt:
      type: object
      required: [id, sourceId, attemptNumber, status, stage, progress, createdAt, heartbeatAt]
      properties:
        id: { type: string }
        sourceId: { type: string }
        attemptNumber: { type: number }
        status:
          type: string
          enum: [queued, running, succeeded, failed, interrupted]
        stage:
          type: string
          enum: [queued, preprocessing, probing, analyzing, persisting, complete]
        progress: { type: number, minimum: 0, maximum: 100 }
        error: { type: ["string", "null"] }
        startedAt: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"] }
        heartbeatAt: { type: string }
        createdAt: { type: string }
    ProjectSource:
      type: object
      required: [id, projectId, name, size, contentType, sourceType, status, progress, attempts, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        size: { type: number }
        contentType: { type: string }
        sourceType:
          type: string
          enum: [FULL_SONG, VOCAL_ONLY, SOLO_INSTRUMENT, INSTRUMENTAL, MIDI, VIDEO]
        status:
          type: string
          enum: [queued, preprocessing, analyzing, ready, failed]
        progress: { type: number, minimum: 0, maximum: 100 }
        durationSeconds: { type: ["number", "null"] }
        sampleRate: { type: ["number", "null"] }
        channels: { type: ["number", "null"] }
        error: { type: ["string", "null"] }
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisAttempt"
        createdAt: { type: string }
    SongModel:
      type: object
      required: [id, projectId, sourceId, version, status, contractVersion, validation, fusion, audio, analysisStartSeconds, analysisDurationSeconds, analysisCoverage, tempoMap, meterMap, keyMap, beats, bars, melody, chords, sections, energy, waveform, stems, dynamics, sourceStems, lyrics, confidenceByField, providerProvenance, fieldStatus, provenance, providers, confidence, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        sourceId: { type: string }
        version: { type: number }
        status:
          type: string
          enum: [ready]
        contractVersion:
          $ref: "#/components/schemas/SongModelContractVersion"
        validation:
          $ref: "#/components/schemas/SongModelValidation"
        fusion:
          $ref: "#/components/schemas/SongModelFusion"
        audio:
          $ref: "#/components/schemas/SongModelAudio"
        analysisStartSeconds: { type: number, minimum: 0 }
        analysisDurationSeconds: { type: number, minimum: 0, maximum: 300 }
        analysisCoverage: { type: number, minimum: 0, maximum: 1 }
        tempoMap:
          type: array
          items:
            $ref: "#/components/schemas/TempoEvent"
        meterMap:
          type: array
          items:
            $ref: "#/components/schemas/MeterEvent"
        keyMap:
          type: array
          items:
            $ref: "#/components/schemas/KeyEvent"
        beats:
          type: array
          items:
            $ref: "#/components/schemas/BeatEvent"
        bars:
          type: array
          items:
            $ref: "#/components/schemas/BarEvent"
        melody:
          type: array
          items:
            $ref: "#/components/schemas/NoteEvent"
        chords:
          type: array
          items:
            $ref: "#/components/schemas/ChordEvent"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/Section"
        energy:
          type: array
          items: { type: number }
        waveform:
          type: array
          items: { type: number }
        stems:
          type: array
          items:
            $ref: "#/components/schemas/SongModelStem"
        dynamics:
          type: array
          items: { type: number }
        sourceStems:
          type: array
          items:
            $ref: "#/components/schemas/SourceStem"
        lyrics:
          type: array
          items:
            $ref: "#/components/schemas/LyricEvent"
        confidenceByField:
          type: object
          additionalProperties: { type: number }
        providerProvenance:
          type: array
          items:
            $ref: "#/components/schemas/ProviderProvenance"
        fieldStatus:
          $ref: "#/components/schemas/SongModelFieldStatus"
        provenance:
          $ref: "#/components/schemas/SongModelProvenance"
        providers:
          type: array
          items: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        createdAt: { type: string }
        parentModelId: { type: ["string", "null"] }
        correction:
          oneOf:
            - $ref: "#/components/schemas/SongModelCorrection"
            - type: "null"
    SongModelCorrection:
      type: object
      required: [correctedBy, correctedAt, fields]
      properties:
        correctedBy: { type: string }
        correctedAt: { type: string }
        fields:
          type: array
          items:
            type: string
            enum: [bpm, key, meter, sections]
    SongModelContractVersion:
      type: string
      enum: ["1.0"]
    SongModelValidation:
      type: object
      required: [status, issues]
      properties:
        status:
          type: string
          enum: [accepted, flagged]
        issues:
          type: array
          items:
            $ref: "#/components/schemas/SongModelValidationIssue"
    SongModelValidationIssue:
      type: object
      required: [code, severity, path, message]
      properties:
        code: { type: string }
        severity:
          type: string
          enum: [error, warning]
        path: { type: string }
        message: { type: string }
        provider: { type: string }
    SongModelFusion:
      type: object
      required: [selectedProvider, confidence, decisions]
      properties:
        selectedProvider: { type: ["string", "null"] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        decisions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProviderFusionDecision"
    ProviderFusionDecision:
      type: object
      required: [provider, status, confidence, compatibility, issues]
      properties:
        provider: { type: string }
        status:
          type: string
          enum: [selected, accepted, flagged, rejected]
        confidence: { type: number, minimum: 0, maximum: 1 }
        compatibility: { type: number, minimum: 0, maximum: 1 }
        issues:
          type: array
          items:
            $ref: "#/components/schemas/SongModelValidationIssue"
    SongModelCorrectionInput:
