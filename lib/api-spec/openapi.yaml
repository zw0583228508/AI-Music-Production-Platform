        playableRange: { type: object, required: [min, max], properties: { min: { type: number }, max: { type: number } } }
        comfortableRange: { type: object, required: [min, max], properties: { min: { type: number }, max: { type: number } } }
        registers: { type: array, items: { type: object, required: [name, min, max, character], properties: { name: { type: string }, min: { type: number }, max: { type: number }, character: { type: string } } } }
        polyphonic: { type: boolean }
        maxVoices: { type: number }
        articulations: { type: array, items: { type: string } }
        constraints:
          type: object
          required: [maxLeap, minNoteDuration, maxSimultaneousNotes]
          properties:
            maxLeap: { type: number }
            minNoteDuration: { type: number }
            maxSimultaneousNotes: { type: number }
            breathSeconds: { type: number }
            strings: { type: number }
            frets: { type: number }
            hands: { type: number }
            feet: { type: number }
        controls:
          type: object
          required: [dynamics, expression, pitchBend, aftertouch]
