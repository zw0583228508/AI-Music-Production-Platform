        score: { type: number }
        melodyFit: { type: number }
        bassFit: { type: number }
        voiceLeading: { type: number }
        harmonicBars: { type: number, minimum: 1 }
        complexity: { type: number, minimum: 1, maximum: 10 }
        candidateRationale:
          type: array
          items:
            $ref: "#/components/schemas/HarmonyCandidateRationale"
