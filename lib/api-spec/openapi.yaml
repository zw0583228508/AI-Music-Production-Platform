          type: string
          enum: [STREAMING, DYNAMIC, CLASSICAL, POP, LOUD, FILM]
    ProductionJob:
      type: object
      required: [id, projectId, kind, status, stage, progress, attempt, maxAttempts, retryable, outputArtifactIds, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        kind: { type: string, enum: [analysis, separation, transcription, arrangement, rendering, mixing, mastering, quality, export] }
        status: { type: string, enum: [queued, running, succeeded, failed, cancel_requested, cancelled] }
        stage: { type: string }
        progress: { type: number }
        attempt: { type: number }
        maxAttempts: { type: number }
        retryable: { type: boolean }
        error:
          type: [object, "null"]
          properties:
            code: { type: string }
            message: { type: string }
